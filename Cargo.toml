[package]
name = "udiskr"
version = "0.2.0"
edition = "2024"
rust-version = "1.99.0"

[dependencies]
futures = { version = "0.3", features = ["std"] }
tokio = { version = "1", features = ["rt", "macros"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
split-debuginfo = "off"
strip = true
